<div class="card bg-base-100 shadow-md p-4">
  <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2 w-full">
    <div class="flex flex-col sm:flex-row items-stretch gap-2 w-full">
      <div class="flex flex-wrap gap-2 w-full">
        <button class="btn btn-sm btn-primary flex-1 min-w-[140px]" id="proximos-eventos-btn">→ Próximos eventos </button>
        <button id="sync-google" class="btn btn-sm btn-primary flex-1 min-w-[140px]">☁ Sincronizar eventos </button>
      </div>
      <div class="flex flex-wrap gap-2 w-full">
        <button id="ideas-plans" class="btn btn-sm btn-primary flex-1 min-w-[140px]" onclick="abrirIdeiasPlanos()">
          💡 Ideias e planos
        </button>
        <button class="btn btn-sm btn-primary flex-1 min-w-[140px]" onclick="abrirConfig()">
          ⚙️ Configurações
        </button>
      </div>
      <div class="flex flex-wrap gap-2 w-full pt-1 border-t border-base-200">
        <button class="btn btn-sm btn-outline flex-1 min-w-[90px]" hx-get="/agenda?view=day&date={{ selected_date.isoformat() if selected_date else hoje }}" hx-target="#calendar" hx-swap="outerHTML">Dia</button>
        <button class="btn btn-sm btn-outline flex-1 min-w-[90px]" hx-get="/agenda?view=week&date={{ selected_date.isoformat() if selected_date else hoje }}" hx-target="#calendar" hx-swap="outerHTML">Semana</button>
        <button class="btn btn-sm btn-outline flex-1 min-w-[90px]" hx-get="/agenda?view=month&date={{ selected_date.isoformat() if selected_date else hoje }}" hx-target="#calendar" hx-swap="outerHTML">Mês</button>
      </div>
    </div>
  </div>
</div>
