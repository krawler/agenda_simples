<li class="flex items-start gap-3 p-3 rounded-lg bg-base-200" data-occ-iso="{{ occ.isoformat() }}" data-dur-min="{{ duracao_minutos if duracao_minutos is not none else 0 }}">
  <div class="text-primary font-mono font-semibold whitespace-nowrap">
    {{ occ.strftime('%H:%M') }}{% if dur %}{{ dur }}{% endif %}
  </div>
  <div class="flex-1">
    <div class="font-medium flex items-center gap-2">
      <a {{ editar|safe }} class="hover:underline">{{ titulo }}</a> {{ badges|safe }}
    </div>
    {{ status_indicador|safe }}
    {{ desc|safe }}
  </div>
  <div class="items-center">
    <div class="radial-progress js-event-progress"
         data-occ-iso="{{ occ.isoformat() }}"
         data-dur-min="{{ duracao_minutos if duracao_minutos is not none else 0 }}"
         style="--value:{{ progresso }}; --size:3rem;"
         aria-valuenow="{{ progresso }}"
         role="progressbar">{{ progresso }}%</div>
  </div>
  <div class="flex justify-end">
    {{ acoes|safe }}
  </div>
</li>
